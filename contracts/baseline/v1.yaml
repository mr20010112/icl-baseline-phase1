  "question": "Does re-training the official ContextFlow (dingjiansw101/ContextFlow c6dee891, train config `ContextFlow`) from the pi0 base checkpoint reproduce the paper's LIBERO unseen-task success rate (ContextFlow ECCV 2026, Table 1)?",
  "hypothesis": "Across 3 training seeds, the mean unseen-task success rate (4 unseen task configurations: LIBERO-Spatial S1/S2 and LIBERO-Object O1/O2, 50 trials each) lies within 0.10 absolute of the paper-reported 0.735. A mean at or below 0.535 would falsify reproduction under this setting.",
  "method": {
    "description": "Official ContextFlow training and evaluation, unchanged: perceiver-style context compressors (32 learnable queries per modality; image 4 layers, state/action 2 layers), context expert randomly initialised, SigLIP and action expert initialised from pi0_base, LoRA rank 32 on the action expert. Training excludes the 8 tasks in LIBERO_UNSEEN_TASKS (config_libero.py). Evaluation uses the official server/client (scripts/serve_policy.py + examples/libero/main_incontext.py) on the 4 unseen Spatial/Object configurations, 50 trials per task, float32 inference. The project wrapper only launches the official commands, verifies inputs, and writes metrics.json; it must not modify the model, loss, sampler, data pipeline or evaluation logic.",
    "implementation": [
      "baseline/runner/contextflow_repro.py",
      "baseline/runner/README.md"
    ]
  },
  "metrics": {
