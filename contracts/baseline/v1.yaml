      "definition": "Per training seed: mean over the 4 unseen task configurations (S1 'pick up the black bowl on the cookie box and place it on the plate', S2 'pick up the black bowl next to the plate and place it on the plate', O1 'pick up the milk and place it in the basket', O2 'pick up the tomato sauce and place it in the basket') of the fraction of 50 evaluation trials that succeed, using the step-19999 checkpoint. Unit: fraction in [0,1]. Aggregated across seeds by mean."
